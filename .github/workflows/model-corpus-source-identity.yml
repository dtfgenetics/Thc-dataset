name: Validate model corpus source identities

on:
  pull_request:
    paths:
      - 'data/diagnostic-profiles.jsonl'
      - 'model_tuning/eval/heldout_v2.jsonl'
      - 'scripts/build-model-corpus.py'
      - 'scripts/audit-model-corpus-source-identities.py'
      - '.github/workflows/model-corpus-source-identity.yml'
  push:
    branches: [main]
    paths:
      - 'data/diagnostic-profiles.jsonl'
      - 'model_tuning/eval/heldout_v2.jsonl'
      - 'scripts/build-model-corpus.py'
      - 'scripts/audit-model-corpus-source-identities.py'
      - '.github/workflows/model-corpus-source-identity.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-test canonical corpus identity audit
        run: python3 scripts/audit-model-corpus-source-identities.py --self-test
      - name: Audit current reviewed corpus
        run: python3 scripts/audit-model-corpus-source-identities.py
