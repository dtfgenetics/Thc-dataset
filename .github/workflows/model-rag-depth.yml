name: Model RAG retrieval depth guard

on:
  pull_request:
    paths:
      - 'scripts/evaluate-rag-depth.py'
      - 'scripts/build-rag-eval-snapshot.py'
      - 'scripts/build-model-corpus.py'
      - 'data/**'
      - 'model_tuning/eval/heldout_v2.jsonl'
      - '.github/workflows/model-rag-depth.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Validate reviewed model corpus
        run: npm run validate:model-corpus
      - name: Materialize reviewed model corpus
        run: python3 scripts/build-model-corpus.py
      - name: Validate current frozen retriever
        run: python3 scripts/build-rag-eval-snapshot.py --self-test
      - name: Validate retrieval-depth gate logic
        run: python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('rag_depth','scripts/evaluate-rag-depth.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.self_test()"
      - name: Enforce required-source recovery by top-5
        run: python3 scripts/evaluate-rag-depth.py | tee rag-depth-results.txt
      - name: Retain retrieval-depth result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-depth-results
          path: rag-depth-results.txt
          retention-days: 14
