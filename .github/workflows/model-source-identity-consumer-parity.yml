name: Grow Doc Source Identity Consumer Parity

on:
  pull_request:
    paths:
      - "scripts/source_identity.py"
      - "scripts/build-model-corpus.py"
      - "scripts/audit-model-semantic-leakage.py"
      - "scripts/validate-model-eval-candidates.py"
      - "scripts/audit-model-eval-candidate-diversity.py"
      - "scripts/test-source-identity-consumer-parity.py"
      - ".github/workflows/model-source-identity-consumer-parity.yml"
  push:
    branches: [main]
    paths:
      - "scripts/source_identity.py"
      - "scripts/build-model-corpus.py"
      - "scripts/audit-model-semantic-leakage.py"
      - "scripts/validate-model-eval-candidates.py"
      - "scripts/audit-model-eval-candidate-diversity.py"
      - "scripts/test-source-identity-consumer-parity.py"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all source identity consumers match the shared contract
        run: python scripts/test-source-identity-consumer-parity.py
      - name: Verify semantic leakage self-test
        run: python scripts/audit-model-semantic-leakage.py --self-test
      - name: Verify shared source identity regression guard
        run: python scripts/test-source-identity.py
