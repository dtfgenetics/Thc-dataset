name: Validate Grow Doc Training-Eligible Supervision

on:
  pull_request:
    paths:
      - 'data/**'
      - 'model_tuning/**'
      - 'scripts/build-model-corpus.py'
      - 'scripts/build-grounded-qa.py'
      - 'scripts/build-training-eligible-supervision.py'
      - 'scripts/freeze-training-eligible-snapshot.py'
      - 'scripts/audit-model-source-evidence-quality.py'
      - '.github/workflows/model-training-eligible-supervision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-training-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test training-eligible builder
        run: python3 scripts/build-training-eligible-supervision.py --self-test
      - name: Validate current strong-evidence supervision lane
        run: python3 scripts/build-training-eligible-supervision.py --check-only
      - name: Self-test frozen training snapshot manifest
        run: python3 scripts/freeze-training-eligible-snapshot.py --self-test
      - name: Materialize strong-evidence supervision
        run: python3 scripts/build-training-eligible-supervision.py
      - name: Freeze exact training snapshot
        run: python3 scripts/freeze-training-eligible-snapshot.py
      - name: Verify frozen training snapshot
        run: python3 scripts/freeze-training-eligible-snapshot.py --check-only
      - name: Upload frozen training snapshot
        uses: actions/upload-artifact@v4
        with:
          name: grow-doc-training-eligible-snapshot
          path: |
            model_tuning/generated/training_eligible/sft_v1.jsonl
            model_tuning/generated/training_eligible/grounded_qa_v1.jsonl
            model_tuning/generated/training_eligible/snapshot_manifest.json
          if-no-files-found: error
