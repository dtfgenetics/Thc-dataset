name: Persist verified open reference media

on:
  push:
    branches: [main]
    paths:
      - 'dataset/acquisition/verified-open-media-candidates*.json'
      - 'scripts/persist-open-reference-media.py'
      - '.github/workflows/persist-open-reference-media.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dataset/acquisition/verified-open-media-candidates*.json'
      - 'scripts/persist-open-reference-media.py'
      - '.github/workflows/persist-open-reference-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-open-reference-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  persist-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download validate hash and stage rights-cleared references
        run: python scripts/persist-open-reference-media.py

      - name: Show validated binary changes
        run: git status --short images/reference

      - name: Commit verified reference binaries and manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add images/reference
          if git diff --cached --quiet -- images/reference; then
            echo 'Persisted reference media already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist verified open reference image binaries'
          git push origin main

      - name: Upload persistence evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: persisted-open-reference-media
          path: images/reference/
          if-no-files-found: error
          retention-days: 30
