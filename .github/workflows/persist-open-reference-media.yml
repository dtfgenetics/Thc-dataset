name: Persist verified open reference media

on:
  push:
    branches: [main]
    paths:
      - 'dataset/acquisition/verified-open-media-candidates*.json'
      - '.github/workflows/persist-open-reference-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-open-reference-media
  cancel-in-progress: false

jobs:
  persist-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download validate hash and persist rights-cleared references
        run: |
          python <<'PY'
          import hashlib
          import json
          import mimetypes
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          from PIL import Image

          acquisition_dir = pathlib.Path('dataset/acquisition')
          candidate_files = sorted(acquisition_dir.glob('verified-open-media-candidates*.json'))
          output_dir = pathlib.Path('images/reference/original')
          output_dir.mkdir(parents=True, exist_ok=True)
          manifest_path = pathlib.Path('images/reference/manifest.json')

          allowed_hosts = {
              'academic.oup.com',
              'oup.silverchair-cdn.com',
              'www.frontiersin.org',
              'frontiersin.org',
              'pmc.ncbi.nlm.nih.gov',
              'www.ncbi.nlm.nih.gov',
              'www.mdpi.com',
              'mdpi-res.com',
              'media.springernature.com',
              'bugwoodcloud.org',
          }
          allowed_licenses = {'CC BY 4.0', 'CC BY 3.0'}
          max_bytes = 20_000_000

          candidates = []
          for source_file in candidate_files:
              batch = json.loads(source_file.read_text(encoding='utf-8'))
              if not isinstance(batch, list):
                  raise SystemExit(f'{source_file}: expected JSON array')
              for item in batch:
                  if not isinstance(item, dict):
                      raise SystemExit(f'{source_file}: every candidate must be an object')
                  candidates.append({**item, 'candidate_manifest': str(source_file)})

          if not candidates:
              raise SystemExit('No verified open-media candidates found.')

          ids = [item.get('id') for item in candidates]
          if None in ids or len(ids) != len(set(ids)):
              raise SystemExit('Candidate IDs must be present and globally unique.')

          def dhash64(image):
              gray = image.convert('L').resize((9, 8), Image.Resampling.LANCZOS)
              pixels = list(gray.getdata())
              value = 0
              for y in range(8):
                  for x in range(8):
                      value <<= 1
                      if pixels[y * 9 + x] > pixels[y * 9 + x + 1]:
                          value |= 1
              return f'dhash64:{value:016x}'

          def extension_for(content_type, final_url):
              ext = pathlib.Path(urllib.parse.urlparse(final_url).path).suffix.lower()
              if ext in {'.jpg', '.jpeg', '.png', '.webp', '.gif', '.tif', '.tiff'}:
                  return ext
              return mimetypes.guess_extension(content_type) or '.img'

          results = []
          expected_files = set()
          for candidate in candidates:
              required = ['id','issue_slug','image_url','source_article','caption','creator','license','license_url','intended_use']
              missing = [key for key in required if not candidate.get(key)]
              if missing:
                  raise SystemExit(f"{candidate.get('id')}: missing {missing}")
              if candidate['intended_use'] != 'reference-only':
                  raise SystemExit(f"{candidate['id']}: only reference-only candidates may be persisted")
              if candidate['license'] not in allowed_licenses:
                  raise SystemExit(f"{candidate['id']}: license is not approved for this persistence workflow: {candidate['license']}")

              parsed = urllib.parse.urlparse(candidate['image_url'])
              if parsed.scheme != 'https' or parsed.hostname not in allowed_hosts:
                  raise SystemExit(f"{candidate['id']}: non-allowlisted image host {parsed.hostname}")

              request = urllib.request.Request(candidate['image_url'], headers={
                  'User-Agent': 'DTF-THC-Dataset-Reference-Persistence/1.0 (+https://github.com/dtfgenetics/Thc-dataset)',
                  'Accept': 'image/*',
                  'Cache-Control': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=45) as response:
                  content_type = response.headers.get_content_type()
                  if not content_type.startswith('image/'):
                      raise SystemExit(f"{candidate['id']}: non-image content type {content_type}")
                  data = response.read(max_bytes + 1)
                  final_url = response.geturl()
              if not data or len(data) > max_bytes:
                  raise SystemExit(f"{candidate['id']}: invalid image byte size {len(data)}")

              safe_id = re.sub(r'[^A-Za-z0-9._-]+', '-', candidate['id']).strip('-')
              ext = extension_for(content_type, final_url)
              output_path = output_dir / f'{safe_id}{ext}'
              output_path.write_bytes(data)
              expected_files.add(output_path.name)

              try:
                  with Image.open(output_path) as image:
                      image.verify()
                  with Image.open(output_path) as image:
                      width, height = image.size
                      image_format = image.format
                      perceptual_hash = dhash64(image)
              except Exception as exc:
                  output_path.unlink(missing_ok=True)
                  raise SystemExit(f"{candidate['id']}: invalid image payload: {exc}")

              sha256 = hashlib.sha256(data).hexdigest()
              results.append({
                  'id': candidate['id'],
                  'issue_slug': candidate['issue_slug'],
                  'repository_path': str(output_path),
                  'source_image_url': candidate['image_url'],
                  'resolved_image_url': final_url,
                  'source_article': candidate['source_article'],
                  'caption': candidate['caption'],
                  'creator': candidate['creator'],
                  'license': candidate['license'],
                  'license_url': candidate['license_url'],
                  'confirmation': candidate.get('confirmation'),
                  'limitations': candidate.get('limitations'),
                  'intended_use': 'reference-only',
                  'trainingEligible': False,
                  'sha256': sha256,
                  'perceptual_hash': perceptual_hash,
                  'bytes': len(data),
                  'mime_type': content_type,
                  'width': width,
                  'height': height,
                  'image_format': image_format,
                  'candidate_manifest': candidate['candidate_manifest'],
                  'verification_status': 'downloaded-image-validated-hashed-and-persisted',
              })
              print(f"PERSISTED {candidate['id']} {width}x{height} {len(data)} bytes sha256={sha256}")

          for existing in output_dir.iterdir():
              if existing.is_file() and existing.name not in expected_files:
                  existing.unlink()

          manifest = {
              'schemaVersion': '1.0.0',
              'status': 'reference-only-persisted',
              'recordCount': len(results),
              'trainingEligibleCount': 0,
              'policy': 'These binaries are rights-cleared reference evidence only. Persistence does not make a full figure or composite model-training eligible.',
              'records': sorted(results, key=lambda item: item['id']),
          }
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'REFERENCE_BINARY_COUNT={len(results)}')
          PY

      - name: Commit verified reference binaries and manifest
        shell: bash
        run: |
          if git diff --quiet -- images/reference; then
            echo 'Persisted reference media already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/reference
          git commit -m 'Persist verified open reference image binaries'
          git push origin main

      - name: Upload persistence evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: persisted-open-reference-media
          path: images/reference/
          if-no-files-found: error
          retention-days: 30
