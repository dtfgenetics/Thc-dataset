name: Export machine-readable dataset

on:
  push:
    branches: [main]
    paths:
      - 'src/data/issues.ts'
      - 'src/data/supplemental-issues.ts'
      - 'scripts/export-machine-data.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/export-machine-data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data/issues.ts'
      - 'src/data/supplemental-issues.ts'
      - 'scripts/export-machine-data.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/export-machine-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export JSON and CSV dataset files
        run: npm run export:data

      - name: Commit generated dataset files
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo 'Machine-readable dataset already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Generate machine-readable dataset exports'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
