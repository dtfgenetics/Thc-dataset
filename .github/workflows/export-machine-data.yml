name: Export machine-readable dataset

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/types.ts'
      - 'dataset/schema/issue.schema.json'
      - 'data/release-readiness.json'
      - 'data/manifest.json'
      - 'scripts/export-machine-data.mjs'
      - 'scripts/validate-data-release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/export-machine-data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/types.ts'
      - 'dataset/schema/issue.schema.json'
      - 'data/release-readiness.json'
      - 'data/manifest.json'
      - 'scripts/export-machine-data.mjs'
      - 'scripts/validate-data-release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/export-machine-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machine-data-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize full diagnostic release
        run: npm run export:data

      - name: Validate generated and curated release layers
        run: npm run validate:data-release

      - name: Show generated changes
        run: git diff --stat -- data

      - name: Commit validated generated dataset files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo 'Machine-readable dataset already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Generate validated machine-readable dataset exports'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

# Pull requests run the same exporter and validator without committing generated files.
