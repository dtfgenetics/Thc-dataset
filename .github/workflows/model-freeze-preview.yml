name: Preview frozen model artifacts

on:
  pull_request:
    paths:
      - 'scripts/build-model-corpus.py'
      - 'scripts/sft_evidence_ranking.py'
      - 'scripts/validate-generated-sft-relevance.py'
      - 'scripts/freeze-model-training-artifacts.py'
      - 'scripts/split-model-training-grounded.py'
      - 'scripts/enforce-supplied-claim-grounding.py'
      - 'data/diagnostic-profiles.jsonl'
      - 'model_tuning/eval/heldout_v2.jsonl'
      - '.github/workflows/model-freeze-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze candidate artifacts
        run: python3 scripts/freeze-model-training-artifacts.py
      - name: Verify integrated SFT relevance
        run: python3 scripts/validate-generated-sft-relevance.py --max-rate 0.02
      - name: Upload candidate frozen artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grow-doc-model-freeze-preview
          path: model_tuning/generated/
          if-no-files-found: error
          retention-days: 3
