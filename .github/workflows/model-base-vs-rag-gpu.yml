name: Grow Doc base vs RAG GPU benchmark

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA already reachable from main'
        required: true
        type: string
      preflight_only:
        description: 'Validate runner/runtime/input contract without model inference'
        required: false
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: grow-doc-base-vs-rag-gpu-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  benchmark:
    # This job intentionally targets a dedicated runner. If no online runner has
    # every label below, GitHub will leave the job queued instead of silently
    # falling back to CPU or an unqualified GPU.
    runs-on: [self-hosted, linux, x64, growdoc-gpu]
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate requested immutable commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require requested commit to already be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main

      - name: Verify clean pinned checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Record runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model_tuning/runs/base_vs_rag_v1
          {
            echo "github_sha=${TARGET_SHA}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            command -v python3 >/dev/null && python3 --version || true
            command -v uv >/dev/null && uv --version || true
            command -v nvidia-smi >/dev/null && nvidia-smi || true
          } > model_tuning/runs/base_vs_rag_v1/runner-diagnostics.txt 2>&1
          cat model_tuning/runs/base_vs_rag_v1/runner-diagnostics.txt

      - name: Assert dedicated Grow Doc GPU runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          command -v nvidia-smi >/dev/null
          command -v python3 >/dev/null
          command -v uv >/dev/null
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader

      - name: Verify qualifying GPU and pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-base-vs-rag-experiment.py --preflight-only 2>&1 | tee model_tuning/runs/base_vs_rag_v1/preflight.txt

      - name: Verify preflight preserved tracked repository bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Stop after successful preflight when requested
        if: github.event_name == 'workflow_dispatch' && inputs.preflight_only
        run: echo 'Qualified GPU/runtime/input preflight passed; inference intentionally skipped.'

      - name: Run frozen Qwen3-8B base vs frozen RAG experiment
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight_only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-base-vs-rag-experiment.py \
            --output-root model_tuning/runs/base_vs_rag_v1

      - name: Verify benchmark preserved tracked repository bytes
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight_only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload benchmark outputs
        if: success() && (github.event_name != 'workflow_dispatch' || !inputs.preflight_only)
        uses: actions/upload-artifact@v7
        with:
          name: grow-doc-base-vs-rag-${{ inputs.commit_sha }}
          path: model_tuning/runs/base_vs_rag_v1/
          if-no-files-found: error
          retention-days: 30

      - name: Upload successful preflight diagnostics
        if: success() && github.event_name == 'workflow_dispatch' && inputs.preflight_only
        uses: actions/upload-artifact@v7
        with:
          name: grow-doc-base-vs-rag-preflight-${{ inputs.commit_sha }}
          path: |
            model_tuning/runs/base_vs_rag_v1/runner-diagnostics.txt
            model_tuning/runs/base_vs_rag_v1/preflight.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed-preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: grow-doc-base-vs-rag-preflight-${{ inputs.commit_sha }}
          path: |
            model_tuning/runs/base_vs_rag_v1/runner-diagnostics.txt
            model_tuning/runs/base_vs_rag_v1/preflight.txt
          if-no-files-found: warn
          retention-days: 14
