name: Transfer Extraction and Dedup Phase 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-qa-phase5.yml'
      - 'scripts/transfer-qa-phase5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image QA dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Reconstruct, extract, hash and deduplicate transfer corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/transfer-qa-phase5.py
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfer-extraction-dedup-phase5
          path: bulk_acquisition/phase5_transfer_qa/
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent QA release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='transfer-qa-phase5-2026-08-14'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file bulk_acquisition/phase5_transfer_qa/phase5-summary.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title 'THC Plant Diagnostic — Transfer Extraction/Dedup Phase 5' --notes-file bulk_acquisition/phase5_transfer_qa/phase5-summary.md
          fi
          gh release upload "$TAG" bulk_acquisition/phase5_transfer_qa/* --clobber
      - name: Summarize
        run: cat bulk_acquisition/phase5_transfer_qa/phase5-summary.md >> "$GITHUB_STEP_SUMMARY"
