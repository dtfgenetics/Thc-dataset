name: Bulk Transfer Acquisition Phase 4B Public Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-transfer-phase4b.yml'
      - 'scripts/bulk-acquire-transfer-phase4b.py'
      - 'scripts/publish-release-chunks-idempotent.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Acquire DS-142, DS-143 and DS-146 through public Download All route
        run: python scripts/bulk-acquire-transfer-phase4b.py

      - name: Upload manifest-only workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thc-transfer-phase4b-manifests
          path: |
            bulk_acquisition/phase4b_public/*manifest.json
            bulk_acquisition/phase4b_public/*inventory.json
            bulk_acquisition/phase4b_public/*parts.json
            bulk_acquisition/phase4b_public/*summary.md
            bulk_acquisition/phase4b_public/*checksums.sha256
          if-no-files-found: warn
          retention-days: 90

      - name: Publish persistent release chunks
        if: success() && hashFiles('bulk_acquisition/phase4b_public/phase4b-manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='bulk-transfer-phase4b-2026-08-14'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file bulk_acquisition/phase4b_public/phase4b-summary.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title 'THC Plant Diagnostic — Bulk Transfer Phase 4B' \
              --notes-file bulk_acquisition/phase4b_public/phase4b-summary.md
          fi
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path("bulk_acquisition/phase4b_public/phase4b-manifest.json").read_text())
          rows = manifest.get("results", [])
          expected = {"DS-142", "DS-143", "DS-146"}
          assert {r.get("datasetId") for r in rows} == expected, "Dataset inventory incomplete"
          for row in rows:
              assert row.get("status") == "acquired", f"Dataset not acquired: {row.get('datasetId')}"
              parts = row.get("archiveParts", [])
              assert parts, f"No archive parts: {row['datasetId']}"
              for part in parts:
                  p = Path("bulk_acquisition/phase4b_public") / part["filename"]
                  assert p.is_file() and p.stat().st_size == part["sizeBytes"], f"Missing or invalid part: {p}"
                  digest = hashlib.sha256()
                  with p.open("rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(block)
                  assert digest.hexdigest() == part["sha256"], f"Checksum mismatch: {p}"
          PY
          shopt -s nullglob
          chunks=(bulk_acquisition/phase4b_public/*.part[0-9][0-9][0-9])
          if (("${#chunks[@]}" == 0)); then
            echo "No archive chunks to publish" >&2
            exit 1
          fi
          bash scripts/publish-release-chunks-idempotent.sh "$TAG" "${chunks[@]}"
          # Keep volatile manifests/summary in the workflow artifact, not under
          # fixed GitHub Release filenames where reruns necessarily collide.

      - name: Summarize
        if: always() && hashFiles('bulk_acquisition/phase4b_public/phase4b-summary.md') != ''
        run: cat bulk_acquisition/phase4b_public/phase4b-summary.md >> "$GITHUB_STEP_SUMMARY"
