name: Verify Open Reference Media

on:
  push:
    branches: [main]
    paths:
      - 'dataset/acquisition/verified-open-media-candidates*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image metadata dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download, validate, and hash candidate media
        run: |
          python <<'PY'
          import hashlib
          import json
          import mimetypes
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          from PIL import Image

          ACQUISITION_DIR = pathlib.Path('dataset/acquisition')
          CANDIDATE_FILES = sorted(ACQUISITION_DIR.glob('verified-open-media-candidates*.json'))
          OUT = pathlib.Path('verified_media')
          OUT.mkdir(exist_ok=True)

          allowed_hosts = {
              'academic.oup.com',
              'oup.silverchair-cdn.com',
              'www.frontiersin.org',
              'frontiersin.org',
              'pmc.ncbi.nlm.nih.gov',
              'www.ncbi.nlm.nih.gov',
              'www.mdpi.com',
              'mdpi-res.com',
              'media.springernature.com',
              'bugwoodcloud.org',
          }
          max_bytes = 20_000_000
          candidates = []
          for candidate_file in CANDIDATE_FILES:
              batch = json.loads(candidate_file.read_text(encoding='utf-8'))
              if not isinstance(batch, list):
                  raise SystemExit(f'{candidate_file}: candidate manifest must be a JSON array.')
              for item in batch:
                  if isinstance(item, dict):
                      item = {**item, 'candidate_manifest': candidate_file.name}
                  candidates.append(item)

          if not candidates:
              raise SystemExit('No open-media candidates were found.')
          candidate_ids = [candidate.get('id') for candidate in candidates if isinstance(candidate, dict)]
          if len(candidate_ids) != len(set(candidate_ids)):
              duplicates = sorted({candidate_id for candidate_id in candidate_ids if candidate_ids.count(candidate_id) > 1})
              raise SystemExit(f'Duplicate candidate IDs across manifests: {duplicates}')

          def dhash64(image: Image.Image) -> str:
              gray = image.convert('L').resize((9, 8), Image.Resampling.LANCZOS)
              pixels = list(gray.getdata())
              value = 0
              for y in range(8):
                  for x in range(8):
                      value <<= 1
                      if pixels[y * 9 + x] > pixels[y * 9 + x + 1]:
                          value |= 1
              return f'dhash64:{value:016x}'

          def accept_header_for(url: str) -> str:
              ext = pathlib.Path(urllib.parse.urlparse(url).path).suffix.lower()
              return {
                  '.png': 'image/png',
                  '.webp': 'image/webp',
                  '.jpg': 'image/jpeg',
                  '.jpeg': 'image/jpeg',
                  '.gif': 'image/gif',
                  '.tif': 'image/tiff',
                  '.tiff': 'image/tiff',
              }.get(ext, 'image/*')

          results = []
          for candidate in candidates:
              if not isinstance(candidate, dict):
                  raise SystemExit('Each candidate must be a JSON object.')
              required = ['id', 'issue_slug', 'image_url', 'source_article', 'caption', 'creator', 'license', 'license_url', 'intended_use']
              missing = [key for key in required if not candidate.get(key)]
              if missing:
                  raise SystemExit(f"{candidate.get('id', '<unknown>')}: missing fields {missing}")
              if candidate['intended_use'] != 'reference-only':
                  raise SystemExit(f"{candidate['id']}: acquisition workflow only admits reference-only candidates")

              parsed = urllib.parse.urlparse(candidate['image_url'])
              if parsed.scheme != 'https' or parsed.hostname not in allowed_hosts:
                  raise SystemExit(f"{candidate['id']}: image host is not allowlisted: {parsed.hostname}")

              requested_accept = accept_header_for(candidate['image_url'])
              request = urllib.request.Request(
                  candidate['image_url'],
                  headers={
                      'User-Agent': 'DTF-THC-Dataset-Reference-Audit/1.0 (+https://github.com/dtfgenetics/Thc-dataset)',
                      'Accept': requested_accept,
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  content_type = response.headers.get_content_type()
                  if not content_type.startswith('image/'):
                      raise SystemExit(f"{candidate['id']}: non-image content type {content_type}")
                  data = response.read(max_bytes + 1)
                  final_url = response.geturl()
              if len(data) > max_bytes:
                  raise SystemExit(f"{candidate['id']}: file exceeds {max_bytes} bytes")

              safe_id = re.sub(r'[^A-Za-z0-9._-]+', '-', candidate['id']).strip('-')
              ext = pathlib.Path(urllib.parse.urlparse(final_url).path).suffix.lower()
              if ext not in {'.jpg', '.jpeg', '.png', '.webp', '.gif', '.tif', '.tiff'}:
                  ext = mimetypes.guess_extension(content_type) or '.img'
              out_path = OUT / f'{safe_id}{ext}'
              out_path.write_bytes(data)

              try:
                  with Image.open(out_path) as image:
                      width, height = image.size
                      image_format = image.format
                      perceptual_hash = dhash64(image)
              except Exception as exc:
                  raise SystemExit(f"{candidate['id']}: Pillow could not parse image: {exc}")

              sha256 = hashlib.sha256(data).hexdigest()
              result = {
                  **candidate,
                  'requested_accept': requested_accept,
                  'resolved_image_url': final_url,
                  'sha256': sha256,
                  'perceptual_hash': perceptual_hash,
                  'bytes': len(data),
                  'mime_type': content_type,
                  'width': width,
                  'height': height,
                  'image_format': image_format,
                  'artifact_path': str(out_path),
                  'verification_status': 'downloaded-hashed-image-verified',
              }
              results.append(result)
              print(f"VERIFIED_MEDIA {candidate['id']} accept={requested_accept} sha256={sha256} perceptual={perceptual_hash} bytes={len(data)} {width}x{height} {content_type}")

          manifest = OUT / 'verified-media-manifest.json'
          manifest.write_text(json.dumps(results, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('THC_MEDIA_ACQUISITION_JSON=' + json.dumps(results, separators=(',', ':'), ensure_ascii=False))
          PY

      - name: Upload verified media evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-open-reference-media
          path: verified_media/
          if-no-files-found: error
          retention-days: 30
