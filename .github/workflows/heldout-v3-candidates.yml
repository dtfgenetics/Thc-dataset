name: Validate Grow Doc Heldout V3 Candidates

on:
  pull_request:
    paths:
      - 'model_tuning/eval/heldout_v3_candidates.jsonl'
      - 'model_tuning/eval/heldout_v2.jsonl'
      - 'model_tuning/eval/candidates/**'
      - 'data/diagnostic-profiles.jsonl'
      - 'scripts/validate-heldout-v3-candidates.py'
      - 'scripts/validate-heldout-v3-field-types.py'
      - 'scripts/build-heldout-v3-promotion-preview.py'
      - 'scripts/audit-model-eval-candidate-leakage.py'
      - 'scripts/audit-model-eval-candidate-diversity.py'
      - 'scripts/audit-model-semantic-leakage.py'
      - 'scripts/audit-model-eval-coverage.py'
      - 'scripts/report-heldout-promotion-gaps.py'
      - 'scripts/source_identity.py'
      - '.github/workflows/heldout-v3-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'model_tuning/eval/heldout_v3_candidates.jsonl'
      - 'model_tuning/eval/heldout_v2.jsonl'
      - 'model_tuning/eval/candidates/**'
      - 'data/diagnostic-profiles.jsonl'
      - 'scripts/validate-heldout-v3-candidates.py'
      - 'scripts/validate-heldout-v3-field-types.py'
      - 'scripts/build-heldout-v3-promotion-preview.py'
      - 'scripts/audit-model-eval-candidate-leakage.py'
      - 'scripts/audit-model-eval-candidate-diversity.py'
      - 'scripts/audit-model-semantic-leakage.py'
      - 'scripts/audit-model-eval-coverage.py'
      - 'scripts/report-heldout-promotion-gaps.py'
      - 'scripts/source_identity.py'
      - '.github/workflows/heldout-v3-candidates.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate heldout-v3 candidate benchmark additions
        run: python scripts/validate-heldout-v3-candidates.py
      - name: Validate heldout-v3 structured field types
        run: python scripts/validate-heldout-v3-field-types.py
      - name: Build fail-closed 16-case promotion preview
        run: python scripts/build-heldout-v3-promotion-preview.py --output /tmp/heldout-v3-promotion-preview.jsonl
      - name: Verify promotion preview shape and candidate-only state
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/heldout-v3-promotion-preview.jsonl').read_text().splitlines() if x.strip()]
          counts=Counter(r['category'] for r in rows)
          assert len(rows)==16, len(rows)
          assert len(counts)==8, counts
          assert set(counts.values())=={2}, counts
          assert all(r.get('promotion_eligible') is False for r in rows)
          print('promotion preview shape: PASS', dict(sorted(counts.items())))
          PY
      - name: Report heldout-v3 per-slice promotion gaps
        run: python scripts/report-heldout-promotion-gaps.py
      - name: Audit combined 16-case promotion-preview coverage readiness
        run: python scripts/audit-model-eval-coverage.py /tmp/heldout-v3-promotion-preview.jsonl --require-replicated-slices
      - name: Self-test candidate leakage auditor
        run: python scripts/audit-model-eval-candidate-leakage.py --self-test
      - name: Audit candidate leakage against training, dev, and heldout-v2
        run: python scripts/audit-model-eval-candidate-leakage.py
      - name: Self-test candidate internal diversity auditor
        run: python scripts/audit-model-eval-candidate-diversity.py --self-test
      - name: Audit candidate internal duplication and source reuse
        run: python scripts/audit-model-eval-candidate-diversity.py
