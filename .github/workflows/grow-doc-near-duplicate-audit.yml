name: Grow Doc Near-Duplicate Audit

on:
  pull_request:
    paths:
      - 'scripts/audit-grow-doc-near-duplicates.py'
      - 'scripts/validate-grow-doc-near-duplicate-suite.py'
      - 'tests/test_grow_doc_near_duplicate_audit.py'
      - '.github/workflows/grow-doc-near-duplicate-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-grow-doc-near-duplicates.py'
      - 'scripts/validate-grow-doc-near-duplicate-suite.py'
      - 'tests/test_grow_doc_near_duplicate_audit.py'
      - '.github/workflows/grow-doc-near-duplicate-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-near-duplicate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate near-duplicate audit
        run: python scripts/validate-grow-doc-near-duplicate-suite.py
