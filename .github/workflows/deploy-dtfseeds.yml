name: Legacy Manual FTP Deploy — THC Grow Doc

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA already reachable from main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dtfseeds
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Hostinger (legacy manual fallback)
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate requested immutable commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require requested commit to already be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify production deployment credentials are configured
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.DTFSEEDS_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.DTFSEEDS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.DTFSEEDS_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.DTFSEEDS_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}" || { echo 'DTFSEEDS_FTP_SERVER is not configured for this production deployment.' >&2; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo 'DTFSEEDS_FTP_USERNAME is not configured for this production deployment.' >&2; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo 'DTFSEEDS_FTP_PASSWORD is not configured for this production deployment.' >&2; exit 1; }
          test -n "${FTP_SERVER_DIR:-}" || { echo 'DTFSEEDS_FTP_SERVER_DIR is not configured for this production deployment.' >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Add deployment marker
        run: |
          echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/deploy-version.txt
          echo "commit=${TARGET_SHA}" >> dist/deploy-version.txt
          echo "repo=${GITHUB_REPOSITORY}" >> dist/deploy-version.txt

      - name: Deploy dist to dtfseeds.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DTFSEEDS_FTP_SERVER }}
          username: ${{ secrets.DTFSEEDS_FTP_USERNAME }}
          password: ${{ secrets.DTFSEEDS_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.DTFSEEDS_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
