name: Audit reference panels for training admission

on:
  push:
    branches: [main, training-panel-audit]
    paths:
      - 'scripts/audit-reference-crops-for-training.py'
      - 'images/reference/crops-manifest.json'
      - 'images/reference/manifest.json'
      - '.github/workflows/audit-reference-training-panels.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-reference-crops-for-training.py'
      - 'images/reference/crops-manifest.json'
      - 'images/reference/manifest.json'
      - 'dataset/training/reference-panel-admission-audit.json'
      - '.github/workflows/audit-reference-training-panels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-reference-training-panels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build training-admission audit
        run: python scripts/audit-reference-crops-for-training.py

      - name: Verify audit has no accidental training promotion
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('dataset/training/reference-panel-admission-audit.json')
          d = json.loads(p.read_text())
          assert d['summary']['trainingEligibleCount'] == 0
          assert all(not row['trainingEligible'] for row in d['panels'])
          assert d['summary']['panelCropCount'] == 66
          print(d['summary'])
          PY

      - name: Commit generated audit on non-PR runs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add dataset/training/reference-panel-admission-audit.json
          if git diff --cached --quiet -- dataset/training/reference-panel-admission-audit.json; then
            echo 'Training-admission audit already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update reference panel training-admission audit'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload admission audit
        uses: actions/upload-artifact@v4
        with:
          name: reference-panel-admission-audit
          path: dataset/training/reference-panel-admission-audit.json
          if-no-files-found: error

      - name: Package normalized panel review candidates
        uses: actions/upload-artifact@v4
        with:
          name: normalized-reference-panel-candidates
          path: |
            images/reference/crops/
            images/reference/crops-manifest.json
            dataset/training/reference-panel-admission-audit.json
          if-no-files-found: error
          retention-days: 30
