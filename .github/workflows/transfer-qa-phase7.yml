name: Transfer QA Phase 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-qa-phase7.yml'
      - 'scripts/transfer-qa-phase7.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare QA release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='transfer-qa-phase7-2026-08-14'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'THC Plant Diagnostic — Transfer QA Phase 7' --notes 'Per-image SHA256/dHash, recursive extraction, exact/cross-class conflict audit for DS-137/138/139/145.'
          fi

  qa:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [DS-137, DS-138, DS-139, DS-145]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Reconstruct and audit one dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/transfer-qa-phase7.py "${{ matrix.dataset }}"
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-${{ matrix.dataset }}-qa
          path: bulk_acquisition/phase7_transfer_qa/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish persistent QA outputs
        if: always() && hashFiles(format('bulk_acquisition/phase7_transfer_qa/{0}/{0}_qa.json', matrix.dataset)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='transfer-qa-phase7-2026-08-14'
          shopt -s nullglob
          files=(bulk_acquisition/phase7_transfer_qa/${{ matrix.dataset }}/*)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}" --clobber
      - name: Summarize
        if: always() && hashFiles(format('bulk_acquisition/phase7_transfer_qa/{0}/{0}_phase7_summary.md', matrix.dataset)) != ''
        run: cat bulk_acquisition/phase7_transfer_qa/${{ matrix.dataset }}/${{ matrix.dataset }}_phase7_summary.md >> "$GITHUB_STEP_SUMMARY"
