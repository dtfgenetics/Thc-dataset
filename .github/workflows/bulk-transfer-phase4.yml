name: Bulk Transfer Acquisition Phase 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-transfer-phase4.yml'
      - 'scripts/bulk-acquire-transfer-phase4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire open transfer datasets
        run: python scripts/bulk-acquire-transfer-phase4.py

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thc-transfer-bulk-acquisition-phase4
          path: bulk_acquisition/phase4_transfer/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish persistent release assets
        if: always() && hashFiles('bulk_acquisition/phase4_transfer/phase4-manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='bulk-transfer-phase4-2026-08-14'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file bulk_acquisition/phase4_transfer/phase4-summary.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title 'THC Plant Diagnostic — Bulk Transfer Acquisition Phase 4' \
              --notes-file bulk_acquisition/phase4_transfer/phase4-summary.md
          fi
          shopt -s nullglob
          files=(bulk_acquisition/phase4_transfer/*)
          if (( ${#files[@]} == 0 )); then
            echo 'No phase-4 files were produced.' >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Summarize acquisition truth state
        if: always() && hashFiles('bulk_acquisition/phase4_transfer/phase4-manifest.json') != ''
        run: cat bulk_acquisition/phase4_transfer/phase4-summary.md >> "$GITHUB_STEP_SUMMARY"
