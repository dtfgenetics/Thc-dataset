name: Validate Cornell bioinformatics sources

on:
  pull_request:
    paths:
      - "dataset/sources/cornell_bioinformatics_registry_v1.json"
      - "dataset/sources/bioinformatics_acquisition_map_v1.json"
      - "scripts/validate-cornell-bioinformatics-registry.py"
      - "scripts/validate-bioinformatics-acquisition-map.py"
      - "scripts/collect-ncbi-genome-metadata.py"
      - "scripts/normalize-ncbi-biosample.py"
      - "scripts/resolve-bioinformatics-identities.py"
      - "scripts/export-brapi-germplasm.py"
      - "scripts/normalize-usda-grin-germplasm.py"
      - "scripts/test-grin-to-brapi-contract.py"
      - "scripts/build-tool-data-bundle.py"
      - "dataset/tool_data_bundle_spec_v1.json"
      - "scripts/normalize-phenotype-observations.py"
      - "dataset/schemas/phenotype_observation_v1.schema.json"
      - "scripts/resolve-trait-ontology-units.py"
      - "dataset/traits/trait_registry_v1.json"
      - "scripts/validate-tool-data-bundle.py"
      - "scripts/test-tool-data-bundle-materialization.py"
      - "dataset/fixtures/tool_bundle/germplasm_fixture.json"
      - "scripts/build-tool-source-catalog.py"
      - "dataset/generated/tool_data/source_catalog_v1.json"
      - "scripts/normalize-reviewed-claims.py"
      - "dataset/schemas/reviewed_claim_v1.schema.json"
      - "scripts/publish-reviewed-rag-claims.py"
      - "scripts/test-rag-claim-publication.py"
      - "dataset/fixtures/tool_bundle/reviewed_claims_fixture.json"
      - "docs/BIOINFORMATICS_ARCHITECTURE.md"
      - ".github/workflows/cornell-bioinformatics-sources.yml"
  push:
    branches: [main]
    paths:
      - "dataset/sources/cornell_bioinformatics_registry_v1.json"
      - "dataset/sources/bioinformatics_acquisition_map_v1.json"
      - "scripts/validate-cornell-bioinformatics-registry.py"
      - "scripts/validate-bioinformatics-acquisition-map.py"
      - "scripts/collect-ncbi-genome-metadata.py"
      - "scripts/normalize-ncbi-biosample.py"
      - "docs/BIOINFORMATICS_ARCHITECTURE.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source identities and ingestion policy
        run: |
          python3 scripts/validate-cornell-bioinformatics-registry.py
          python3 scripts/validate-bioinformatics-acquisition-map.py
          python3 scripts/collect-ncbi-genome-metadata.py --self-test
          python3 scripts/normalize-ncbi-biosample.py --self-test
          python3 scripts/resolve-bioinformatics-identities.py --self-test
          python3 scripts/export-brapi-germplasm.py --self-test
          python3 scripts/normalize-usda-grin-germplasm.py --self-test
          python3 scripts/test-grin-to-brapi-contract.py
          python3 scripts/build-tool-data-bundle.py --self-test
          python3 scripts/normalize-phenotype-observations.py --self-test
          python3 scripts/resolve-trait-ontology-units.py --self-test
          python3 scripts/validate-tool-data-bundle.py --self-test
          python3 scripts/test-tool-data-bundle-materialization.py
          python3 scripts/build-tool-source-catalog.py --self-test
          python3 scripts/normalize-reviewed-claims.py --self-test
          python3 scripts/publish-reviewed-rag-claims.py --self-test
          python3 scripts/test-rag-claim-publication.py
