name: Validate Cornell bioinformatics sources

on:
  pull_request:
    paths:
      - "dataset/sources/cornell_bioinformatics_registry_v1.json"
      - "scripts/validate-cornell-bioinformatics-registry.py"\n      - "dataset/sources/bioinformatics_acquisition_map_v1.json"\n      - "scripts/validate-bioinformatics-acquisition-map.py"\n      - "docs/BIOINFORMATICS_ARCHITECTURE.md"
      - ".github/workflows/cornell-bioinformatics-sources.yml"
  push:
    branches: [main]
    paths:
      - "dataset/sources/cornell_bioinformatics_registry_v1.json"
      - "scripts/validate-cornell-bioinformatics-registry.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source identities and ingestion policy
        run: |\n          python3 scripts/validate-cornell-bioinformatics-registry.py\n          python3 scripts/validate-bioinformatics-acquisition-map.py
