name: Validate THC Grow Doc

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:sources
      - run: npm run validate:acquisition
      - run: npm run validate:transfer
      - run: npm run validate:model-eval
      - run: npm run validate:model-base-candidates
      - run: npm run validate:model-eval-candidates
      - run: npm run validate:model-eval-coverage
      - run: npm run validate:model-corpus-quality
      - run: npm run validate:model-semantic-leakage
      - run: npm run validate:model-corpus
      - name: Audit SFT profile evidence relevance
        run: |
          python3 scripts/audit-sft-profile-relevance.py --self-test
          python3 scripts/audit-sft-profile-relevance.py
      - run: npm run validate:grounded-qa
      - run: npm run validate:model-split
      - name: Validate supplied-claim grounding
        run: python3 scripts/enforce-supplied-claim-grounding.py --self-test
      - name: Validate grounded training split
        run: |
          python3 scripts/split-model-training-grounded.py --self-test
          python3 scripts/split-model-training-grounded.py --check-only
      - run: npm run validate:training-dataset-manifest
      - run: npm run validate:model-scorer
      - run: npm run validate:model-run-manifest
      - run: npm run validate:model-runner
      - run: npm run validate:rag-snapshot
      - run: npm run validate:qlora-config
      - run: python3 scripts/validate-qlora-config.py --real-run
      - name: Validate QLoRA trainer structure
        run: python3 scripts/train-grow-doc-qlora.py --self-test
      - name: Verify reproducible QLoRA dependency lock
        run: |
          python3 scripts/verify-qlora-dependency-contract.py --self-test
          python3 -m pip install --disable-pip-version-check uv==0.12.10
          python3 scripts/verify-qlora-dependency-contract.py --materialize
      - name: Verify pinned Qwen3 tokenizer chat template
        run: |
          python3 scripts/materialize-chat-template.py --self-test
          python3 scripts/materialize-chat-template.py \
            --tokenizer-repo Qwen/Qwen3-8B \
            --tokenizer-revision b968826d9c46dd6066d109eabc6255188de91218 \
            --expected-sha256 a55ee1b1660128b7098723e0abcd92caa0788061051c62d51cbe87d9cf1974d8
      - name: Freeze model training artifacts
        run: python3 scripts/freeze-model-training-artifacts.py
      - name: Verify frozen QLoRA artifact bytes
        run: |
          python3 scripts/verify-qlora-artifacts.py --self-test
          python3 scripts/verify-qlora-artifacts.py
      - name: Freeze heldout v2 RAG snapshot
        run: |
          python3 scripts/build-rag-eval-snapshot.py \
            --claims model_tuning/generated/rag/claims_v1.jsonl \
            --benchmark model_tuning/eval/heldout_v2.jsonl \
            --output model_tuning/rag_snapshots/heldout_v2.jsonl \
            --manifest model_tuning/rag_snapshots/heldout_v2.manifest.json \
            --top-k 5
      - name: Validate strict no-offload evaluator
        run: python3 scripts/run-model-eval-strict.py --strict-self-test
      - name: Validate base-vs-RAG launcher
        run: python3 scripts/run-base-vs-rag-experiment.py --self-test
      - name: Validate blinded base-vs-RAG review workflow
        run: python3 scripts/prepare-base-rag-blind-review.py --self-test
      - name: Validate dedicated base-vs-RAG scorer
        run: python3 scripts/score-base-vs-rag-eval.py --self-test
      - name: Upload frozen model training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grow-doc-model-training-artifacts
          path: model_tuning/generated
          if-no-files-found: error
      - name: Upload frozen heldout v2 RAG snapshot
        uses: actions/upload-artifact@v4
        with:
          name: grow-doc-heldout-v2-rag-snapshot
          path: model_tuning/rag_snapshots
          if-no-files-found: error
      - run: npm run check
      - run: npm test
      - name: Validate visual observation PHP proxy
        run: php -l public/api/visual-observations.php
      - run: npm run build
      - name: Verify visual observation proxy ships in the production bundle
        run: test -f dist/api/visual-observations.php
