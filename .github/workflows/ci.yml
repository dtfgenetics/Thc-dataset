name: Validate THC Grow Doc

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:sources
      - run: npm run validate:acquisition
      - run: npm run validate:transfer
      - run: npm run check
      - run: npm test
      - run: npm run build
