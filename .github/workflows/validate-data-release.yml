name: Validate machine-readable data release

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/types.ts'
      - 'dataset/schema/issue.schema.json'
      - 'data/**'
      - 'images/reference/**'
      - 'scripts/validate-data-release.mjs'
      - 'scripts/validate-reference-crop-geometry.mjs'
      - 'scripts/validate-release-metadata.mjs'
      - 'scripts/export-machine-data.mjs'
      - 'scripts/persist-open-reference-media.py'
      - 'scripts/build-reference-crops.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-data-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/types.ts'
      - 'dataset/schema/issue.schema.json'
      - 'data/**'
      - 'images/reference/**'
      - 'scripts/validate-data-release.mjs'
      - 'scripts/validate-reference-crop-geometry.mjs'
      - 'scripts/validate-release-metadata.mjs'
      - 'scripts/export-machine-data.mjs'
      - 'scripts/persist-open-reference-media.py'
      - 'scripts/build-reference-crops.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-data-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize current reviewed catalog release
        run: npm run export:data

      - name: Validate profiles sources media bytes crops and training gate
        run: npm run validate:data-release

      - name: Validate manual and grid crop geometry
        run: npm run validate:crop-geometry

      - name: Validate cross-file release metadata consistency
        run: npm run validate:release-metadata

      - name: Summarize release counts
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('data/manifest.json', 'utf8'))
          const generated = JSON.parse(fs.readFileSync('data/export-manifest.json', 'utf8'))
          console.log(JSON.stringify({
            diagnosticProfiles: generated.counts.diagnosticProfiles,
            coreProfiles: generated.counts.primaryDiagnosticProfiles,
            supplementalAndExpandedProfiles: generated.counts.supplementalDiagnosticProfiles,
            evidenceSources: generated.counts.sources,
            profileLinkedMedia: generated.counts.profileReferenceMedia,
            referenceOriginals: manifest.localReferenceImageBinaryCount,
            unavailableReferences: manifest.referenceUnavailableCount,
            referenceCrops: manifest.referencePanelCropCount,
            referenceCropSourceGroups: manifest.referencePanelCropSourceGroupCount,
            totalReferenceImages: manifest.totalPersistedReferenceImageFiles,
            trainingEligible: generated.counts.trainingEligibleMedia,
            supervisedTrainingReady: manifest.supervisedTrainingReady,
          }, null, 2))
          NODE
